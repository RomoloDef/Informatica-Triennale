version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    volumes:
      # Volume per il database (già presente)
      - ./database_data:/app/database_data
      # Salva le immagini nella cartella 'uploads' del tuo PC
      - ./uploads:/app/uploads
    environment:
      - UPLOAD_DIR=/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8081:80"
    depends_on:
      - backend