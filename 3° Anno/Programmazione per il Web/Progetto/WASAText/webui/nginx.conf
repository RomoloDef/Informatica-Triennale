events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # ------------------------------------------------------------
        # 1. FRONTEND (Vue.js)
        # Serve i file statici compilati (HTML, CSS, JS)
        # ------------------------------------------------------------
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            
            # CRUCIALE PER VUE ROUTER:
            # Se il browser chiede una pagina che non è un file fisico (es. /login),
            # Nginx restituisce index.html e lascia che Vue gestisca la rotta.
            try_files $uri $uri/ /index.html;
        }

        # ------------------------------------------------------------
        # 2. BACKEND API
        # Nginx inoltra queste richieste al container "backend" sulla porta 3000
        # ------------------------------------------------------------

        # Gestisce: Login, Creazione Utente, Ricerca, Profilo, Foto, ecc.
        location /users {
            proxy_pass http://backend:3000;
        }

        # Gestisce: Lista Chat, Messaggi, Gruppi, Descrizioni, Reazioni, ecc.
        # (Copre automaticamente /chats/{id}/messages, /chats/{id}/description, ecc.)
        location /chats {
            proxy_pass http://backend:3000;
        }
    }
}