openapi: 3.0.0
info:
  title: Pokémon Team Builder API
  description: API per la gestione dei team Pokémon.
  version: 1.0.0

paths: {}


components:
  schemas:
    NewTeamRequest:
      type: object
      required:
        - name
        - trainer
      properties:
        name:
          type: string
          description: Nome del team
          example: Blue Thunder
        trainer:
          type: string
          description: Nome dell'allenatore
          example: Ash
        pokemon_names:
          type: array
          description: Lista dei nomi Pokémon nel team (massimo 6)
          maxItems: 6
          items:
            type: string
          example:
            - bulbasaur
            - eevee

    Team:
      type: object
      properties:
        id:
          type: integer
          description: ID univoco del team
          example: 101
        name:
          type: string
          example: Blue Thunder
        trainer:
          type: string
          example: Ash
        members_count:
          example: 2
          type: integer
          description: Numero attuale di Pokémon nel team